<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Education Section with Pop-up</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f9f9f9;
            color: #333;
        }
        .education-section {
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
            background-color: #fff;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        .education-section h2 {
            text-align: center;
            color: #6a1b9a;
        }
        .timeline {
            position: relative;
            padding: 20px 0;
            list-style: none;
        }
        .timeline::before {
            content: '';
            position: absolute;
            top: 0;
            bottom: 0;
            width: 2px;
            background: #6a1b9a;
            left: 50%;
            margin-left: -1px;
        }
        .timeline-item {
            margin: 20px 0;
            position: relative;
        }
        .timeline-item::before {
            content: '';
            position: absolute;
            left: 50%;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #6a1b9a;
            margin-left: -10px;
            top: 0;
        }
        .timeline-content {
            padding: 20px;
            background: #f3e5f5;
            border-radius: 8px;
            position: relative;
            width: 35%;
        }
        .timeline-content.left {
            left: 0;
        }
        .timeline-content.right {
            left: 55%;
        }
        .timeline-content h3 {
            margin-top: 0;
        }
        .timeline-content p {
            margin: 5px 0;
        }
        .timeline-content a {
            color: #6a1b9a;
            text-decoration: none;
            cursor: pointer;
        }
  
        .popup {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: #fff;
            padding: 20px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            border-radius: 8px;
            z-index: 1000;
        }
        .popup-content h3 {
            margin-top: 0;
        }
        .popup .close-btn {
            background-color: #6a1b9a;
            color: #fff;
            border: none;
            padding: 5px 10px;
            cursor: pointer;
            border-radius: 4px;
        }
        .overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 500;
        }
    </style>
</head>
<body>
    <div class="education-section">
        <h2>🎓 Education</h2>
        <ul class="timeline">
            <li class="timeline-item">
                <div class="timeline-content left">
                    <h3>SSC</h3>
                    <p>Thushara High School</p>
                    <p>2019-2020</p>
                    <a href="#" onclick="showPopup('Thushara High School', 'Warangal, Telangana')">View More</a>
                </div>
            </li>
            <li class="timeline-item">
                <div class="timeline-content right">
                    <h3>Class 12th</h3>
                    <p>SR Junior College</p>
                    <p>2021-2022</p>
                    <a href="#" onclick="showPopup('SR Junior College', 'Hanamkonda, Telangana')">View More</a>
                </div>
            </li>
            <li class="timeline-item">
                <div class="timeline-content left">
                    <h3>College</h3>
                    <p>SR University, Hanamkonda</p>
                    <p>2021-2026</p>
                    <a href="#" onclick="showPopup('Btech, Computer Science, SR University, Hanamkonda')">View More</a>
                </div>
            </li>
        </ul>
    </div>

    <div class="overlay" id="overlay"></div>
    <div class="popup" id="popup">
        <div class="popup-content">
            <h3 id="popup-title"></h3>
            <p id="popup-details"></p>
            <button class="close-btn" onclick="closePopup()">Close</button>
        </div>
    </div>

    <script>
        function showPopup(title, details) {
            document.getElementById('popup-title').textContent = title;
            document.getElementById('popup-details').textContent = details;
            document.getElementById('popup').style.display = 'block';
            document.getElementById('overlay').style.display = 'block';
        }

        function closePopup() {
            document.getElementById('popup').style.display = 'none';
            document.getElementById('overlay').style.display = 'none';
        }
    </script>
</body>
</html>
